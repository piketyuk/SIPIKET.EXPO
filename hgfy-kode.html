  <body class="is-login">
    <a class="skip" href="#main">Lewati ke konten</a>

    <main id="main">
      <section class="page-hero" aria-labelledby="admin-title">
        <h1 id="admin-title" style="font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.04em; font-size: clamp(1.8rem, 5vw, 2.6rem); color: #fff">Manajemen Kode</h1>

        <div id="passwordGate" style="max-width: 420px; margin: 22px auto; display: grid; gap: 16px; background: rgba(18,18,20,0.96); border: 1px solid rgba(255,255,255,0.1); border-radius: 22px; padding: 22px; box-shadow: 0 12px 32px rgba(0,0,0,0.3)">
          <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; text-align: center; font-size: 1.2rem; color: #fff">Verifikasi Admin</h2>
          <label for="adminPassword" style="font-weight: 600; font-size: 0.88rem; display: grid; gap: 6px; color: #fff">Password Admin<input id="adminPassword" type="password" placeholder="Masukkan password" style="padding: 12px 14px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.15); font: inherit; background: rgba(255,255,255,0.08); color: #fff" /></label>
          <button type="button" id="verifyAdminBtn" class="btn-primary btn-full" style="justify-content: center">Masuk →</button>
          <p id="adminHint" role="status" aria-live="polite" style="text-align: center; font-size: 0.78rem; color: rgba(155,161,170,0.9); min-height: 1em"></p>
        </div>

        <div id="adminPanel" hidden style="max-width: 560px; margin: 22px auto; display: grid; gap: 24px">
          <div style="background: rgba(18,18,20,0.96); border: 1px solid rgba(255,255,255,0.1); border-radius: 22px; padding: 22px; display: grid; gap: 14px">
            <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; text-align: center; font-size: 1.2rem; color: #fff">Buat Kode Guru</h2>
            <label for="guruCodeInput" style="font-weight: 600; font-size: 0.88rem; display: grid; gap: 6px; color: #fff">Kode Guru<input id="guruCodeInput" type="text" placeholder="Kode bebas format" maxlength="20" style="padding: 12px 14px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.15); font: inherit; background: rgba(255,255,255,0.08); color: #fff" required /></label>
            <label for="guruQuota" style="font-weight: 600; font-size: 0.88rem; display: grid; gap: 6px; color: #fff">Jumlah Pengguna (1-5)<select id="guruQuota" style="padding: 12px 14px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.15); font: inherit; background: rgba(255,255,255,0.08); color: #fff"><option value="" disabled selected>Pilih jumlah</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></label>
            <button type="button" id="createGuruCodeBtn" class="btn-primary btn-full" style="justify-content: center">Buat Kode →</button>
            <p id="guruCodeHint" role="status" aria-live="polite" style="text-align: center; font-size: 0.78rem; color: rgba(155,161,170,0.9); min-height: 1em"></p>
          </div>

          <div style="background: rgba(18,18,20,0.96); border: 1px solid rgba(255,255,255,0.1); border-radius: 22px; padding: 22px; display: grid; gap: 14px">
            <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; text-align: center; font-size: 1.2rem; color: #fff">Daftar Kode Guru</h2>
            <div id="guruCodesList" style="display: grid; gap: 10px; max-height: 400px; overflow-y: auto">
              <p style="text-align: center; font-size: 0.82rem; color: rgba(155,161,170,0.9)">Belum ada kode guru</p>
            </div>
          </div>

          <div style="background: rgba(18,18,20,0.96); border: 1px solid rgba(255,255,255,0.1); border-radius: 22px; padding: 22px; display: grid; gap: 14px">
            <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; text-align: center; font-size: 1.2rem; color: #fff">Hapus Akun</h2>
            <label for="deleteEmailInput" style="font-weight: 600; font-size: 0.88rem; display: grid; gap: 6px; color: #fff">Email Akun<input id="deleteEmailInput" type="email" placeholder="email@example.com" maxlength="100" style="padding: 12px 14px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.15); font: inherit; background: rgba(255,255,255,0.08); color: #fff" required /></label>
            <button type="button" id="deleteAccountBtn" class="btn-primary btn-full" style="justify-content: center; background: rgba(255,107,107,0.3); border: 1px solid rgba(255,107,107,0.5)">Hapus Akun →</button>
            <p id="deleteAccountHint" role="status" aria-live="polite" style="text-align: center; font-size: 0.78rem; color: rgba(155,161,170,0.9); min-height: 1em"></p>
          </div>
        </div>
      </section>
